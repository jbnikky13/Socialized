<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Socialized · Ambient Worlds</title><style>body{font-family:system-ui;margin:0;background:#0d1020;color:#f5f5f5}main{max-width:900px;margin:0 auto;padding:48px 24px}section{background:#171b31;border:1px solid #2a3154;border-radius:18px;padding:24px;margin-top:20px}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #3b446b}input{width:100%;box-sizing:border-box;background:#0d1020;color:#fff}button{background:#fff;color:#111;cursor:pointer;margin-top:12px}.status{margin-top:16px;padding:12px;border-radius:10px;background:#10152a}.ok{font-weight:700}a{color:#9fc5ff}</style></head><body><main><h1>🌙 Socialized</h1><p class="ok">Ambient Worlds dashboard is online.</p><section><h2>Queue an ambient render</h2><p>Vercel submits the job; GitHub Actions performs the FFmpeg rendering.</p><input id="image" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com/environment.jpg"><input id="title" placeholder="Video title" style="margin-top:10px"><button onclick="queue()">🌧️ Queue render</button><div id="status" class="status">Ready.</div></section></main><script>
function validHttpUrl(value){try{const u=new URL(value.trim());return u.protocol==='http:'||u.protocol==='https:'}catch{return false}}
async function queue(){
 const status=document.getElementById('status');
 const image=document.getElementById('image').value.trim();
 const title=document.getElementById('title').value.trim()||'Ambient World';
 if(!validHttpUrl(image)){status.textContent='Enter a complete public image URL beginning with https:// or http://.';return}
 status.textContent='Queueing…';
 try{
  const r=await fetch('/api/queue-render',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({payload:{image_url:image,title,duration_hours:0.0167,layers:['rain','fireplace','room_tone'],thumbnail_text:title}})});
  const text=await r.text();let j;try{j=JSON.parse(text)}catch{throw new Error('The server returned an invalid response ('+r.status+').')}
  if(!r.ok)throw new Error(j.error||'Queue failed');
  status.textContent='Queued: '+j.job.id+' · '+j.job.status;
  poll(j.job.id)
 }catch(e){status.textContent='Error: '+(e.message||'Queue failed')}
}
async function poll(id){
 const s=document.getElementById('status');
 try{
  const r=await fetch('/api/job-status?id='+encodeURIComponent(id),{headers:{'Accept':'application/json'}});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error||'Status request failed');
  if(j.job){
   s.textContent='Job '+j.job.status+' · '+(j.job.progress||0)+'%';
   if(['queued','processing'].includes(j.job.status))setTimeout(()=>poll(id),5000);
   else if(j.job.status==='completed'&&j.job.result&&j.job.result.public_url)s.innerHTML='Completed · <a href="'+j.job.result.public_url+'" target="_blank" rel="noopener">Open rendered video</a>';
   else if(j.job.status==='failed')s.textContent='Render failed: '+(j.job.error||'Unknown worker error');
  }
 }catch(e){s.textContent='Status error: '+(e.message||'Unknown error')}
}
</script></body></html>
