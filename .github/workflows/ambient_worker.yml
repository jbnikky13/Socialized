name: Ambient Render Worker

on:
  workflow_dispatch:
  repository_dispatch:
    types: [render_requested]
  push:
    branches: [main]
    paths:
      - 'workers/ambient_worker.py'
      - 'workers/ambient_worker_v2.py'
      - 'workers/ambient_worker_safe.py'
      - 'services/__init__.py'
      - 'services/thumbnail.py'
      - 'services/scene_motion.py'
      - '.github/workflows/ambient_worker.yml'
      - 'api/queue-render.js'
      - 'api/upload-image.js'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: socialized-ambient-${{ github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: media-assets
      MAX_IMAGE_MB: 20
      MAX_VIDEO_MB: 45
      PYTHONPATH: ${{ github.workspace }}
      RENDER_JOB_ID: ${{ github.event.client_payload.job_id || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install worker dependencies
        run: python -m pip install --upgrade pip requests Pillow
      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          ffmpeg -version | head -n 1
      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL secret is missing'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY secret is missing'; exit 1; }
      - name: Verify worker environment
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python -c "import sys; print('Python path:', sys.path); import services; print('services import passed'); from services.thumbnail import generate_thumbnail; print('thumbnail import passed'); from services.scene_motion import make_scene_overlay; print('scene motion import passed'); import workers.ambient_worker_safe; print('safe worker import passed')"
      - name: Show dispatch context
        shell: bash
        run: |
          if [ -n "$RENDER_JOB_ID" ]; then echo "Target render job: $RENDER_JOB_ID"; else echo "No dispatch job ID; worker will use the scheduled/manual queue fallback."; fi
      - name: Process render
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python workers/ambient_worker_safe.py
