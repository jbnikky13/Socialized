name: Daily YouTube Content Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate application imports
        run: python -c "import app; print('YouTube Content Bot import check passed')"
