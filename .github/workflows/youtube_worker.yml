name: YouTube Publisher Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['workers/youtube_worker.py','.github/workflows/youtube_worker.yml']
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: socialized-youtube-worker
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: media-assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip requests cryptography google-api-python-client google-auth google-auth-oauthlib
      - run: python workers/youtube_worker.py
