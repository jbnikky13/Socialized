name: YouTube Publisher Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/youtube_worker.py'
      - '.github/workflows/youtube_worker.yml'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: socialized-youtube-worker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: media-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install worker dependencies
        run: python -m pip install --upgrade pip requests cryptography google-api-python-client google-auth google-auth-oauthlib
      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL secret is missing'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY secret is missing'; exit 1; }
      - name: Process queued YouTube publish
        run: python workers/youtube_worker.py
