<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Socialized · Ambient Worlds</title><style>body{font-family:system-ui;margin:0;background:#0d1020;color:#f5f5f5}main{max-width:900px;margin:0 auto;padding:48px 24px}section{background:#171b31;border:1px solid #2a3154;border-radius:18px;padding:24px;margin-top:20px}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #3b446b}input{width:100%;box-sizing:border-box;background:#0d1020;color:#fff}button{background:#fff;color:#111;cursor:pointer;margin-top:12px}.status{margin-top:16px;padding:12px;border-radius:10px;background:#10152a}.ok{font-weight:700}</style></head><body><main><h1>🌙 Socialized</h1><p class="ok">Ambient Worlds dashboard is online.</p><section><h2>Queue an ambient render</h2><p>Vercel submits the job; the production worker performs FFmpeg rendering.</p><input id="image" placeholder="Environment image URL"><input id="title" placeholder="Video title" style="margin-top:10px"><button onclick="queue()">🌧️ Queue render</button><div id="status" class="status">Ready.</div></section></main><script>async function queue(){const status=document.getElementById('status');const image=document.getElementById('image').value.trim();const title=document.getElementById('title').value.trim()||'Ambient World';if(!image){status.textContent='Add an environment image URL.';return}status.textContent='Queueing…';try{const r=await fetch('/api/queue-render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payload:{image_url:image,title,duration_hours:0.0167,layers:['rain','fireplace','room_tone'],thumbnail_text:title}})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Queue failed');status.textContent='Queued: '+j.job.id+' · '+j.job.status;poll(j.job.id)}catch(e){status.textContent='Error: '+e.message}}async function poll(id){const s=document.getElementById('status');try{const r=await fetch('/api/job-status?id='+encodeURIComponent(id));const j=await r.json();if(j.job){s.textContent='Job '+j.job.status+' · '+(j.job.progress||0)+'%';if(['queued','processing'].includes(j.job.status))setTimeout(()=>poll(id),5000)}}catch(e){s.textContent='Status error: '+e.message}}</script></body></html>
